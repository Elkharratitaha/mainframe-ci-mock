version: '3.8'

services:
  backend:
    build:
      context: ./mainframe-api
      dockerfile: Dockerfile
    container_name: mainframe-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./mainframe-ui
      dockerfile: Dockerfile
    container_name: mainframe-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
